<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- ★★ 2026-07-20: title/description/OG ต้องอยู่ใน HTML จริง ไม่ใช่ใส่ทีหลังด้วย JS
       บอทของ LinkedIn / X / Facebook / Google อ่านแต่ HTML ดิบ ไม่รัน JS
       ก่อนหน้านี้ title คือ "Interactive Game Resume" → แปะลิงก์แล้วขึ้นกล่องเปล่า
       (document.title ยังถูกเขียนทับด้วย BRAND ใน title.js สำหรับคนที่เปิดจริง) -->
  <title>Nipith Wongsirikul — Game Localization · LQA · Thai-market Marketing (JA/EN→TH)</title>
  <meta name="description" content="Nipith Wongsirikul — game localization (JA/EN→TH), LQA and Thai-market marketing. Portfolio and resume: 13 titles shipped with Thai on Steam, console LQA at DIGITAL HEARTS, JETRO pavilion at Thailand Game Show. Explore it as a small moon library, or read the plain resume.">
  <meta name="author" content="Nipith Wongsirikul">
  <meta name="theme-color" content="#101226">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nipith Wongsirikul — Portfolio">
  <meta property="og:title" content="Nipith Wongsirikul — Game Localization · LQA · Thai-market Marketing">
  <meta property="og:description" content="JA/EN→TH game localization, LQA and Thai-market marketing · 13 titles shipped with Thai on Steam · 1M+ characters · JETRO pavilion at Thailand Game Show · portfolio + resume">
  <!-- ★★ og:image / og:url ต้องเป็น URL เต็มเสมอ — บอทบางเจ้า (โดยเฉพาะ LinkedIn)
       ไม่ยอม resolve path สัมพัทธ์ แล้วจะขึ้นการ์ดไม่มีรูป
       ถ้าย้ายโดเมนเมื่อไหร่ ต้องกลับมาแก้ 3 บรรทัดนี้ (og:image · og:url · canonical) -->
  <meta property="og:url" content="https://gatipnw.github.io/">
  <meta property="og:image" content="https://gatipnw.github.io/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ja_JP">
  <meta property="og:locale:alternate" content="th_TH">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nipith Wongsirikul — Game Localization · LQA · Thai-market Marketing">
  <meta name="twitter:description" content="JA/EN→TH game localization · LQA · Thai-market marketing — portfolio and resume">
  <meta name="twitter:image" content="https://gatipnw.github.io/assets/og-image.jpg">

  <link rel="canonical" href="https://gatipnw.github.io/">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- ★ preload เฉพาะของที่ "จอแรก" ต้องใช้ (2026-07-20 — แก้อาการค้างก่อนเข้า Title)
       เดิมภาพห้อง/เฟอร์นิเจอร์แย่งแบนด์วิดท์กับฉากหลัง Title ทำให้ Title ขึ้นช้า ~5s
       ภาพห้องย้ายไปโหลดทีหลังแล้ว (renderer.preloadRoom() ใน main.js) -->
  <link rel="preload" as="image" href="assets/kratib.webp" fetchpriority="high">
  <link rel="preload" as="image" href="assets/bg-sky.webp">
  <link rel="preload" as="image" href="assets/bg-mid.webp">
  <link rel="preload" as="image" href="assets/bg-near.webp">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Shippori+Mincho:wght@500;600;700;800&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- ช่วงเปิดตัว: ข้อความทั้งหมดถูกเติมโดย JS จาก content.js -->
  <!-- ตัวบอกสถานะระหว่างรอโมดูล/ฟอนต์โหลด (CSS ล้วน ไม่รอ JS)
       title.js ลบทิ้งทันทีที่ Title พร้อม — กันจอว่างเปล่าดูเหมือนเว็บค้าง -->
  <div id="boot"><span class="boot-moon">月</span><span class="boot-bar"></span></div>

  <div id="intro">
    <canvas id="fx-canvas"></canvas>
    <img id="kratib" src="assets/kratib.webp" alt="Gatip" draggable="false" fetchpriority="high">
    <div id="intro-flash"></div>
    <div class="bar bar-top"></div>
    <div class="bar bar-bottom"></div>
    <div id="intro-title">
      <div id="intro-logo"></div>
      <div id="intro-tagline"></div>
      <!-- ★ 2026-09-13: สายงาน + คู่ภาษา เห็นตั้งแต่วินาทีแรก (ครบ 3 ภาษา ผ่าน content.js) -->
      <div id="intro-role"></div>
      <div id="intro-pair"></div>
      <div id="intro-actions">
        <!-- ปุ่มหลัก = สำรวจพอร์ตแบบเกม (user gesture แรก → เสียงเล่นได้) -->
        <button id="press-start" type="button" class="btn-primary"><span class="btn-main"></span><span class="btn-sub"></span></button>
        <!-- ปุ่มรอง = Resume Mode ทันที ไม่ต้องเล่นเกม -->
        <button id="title-resume" type="button" class="btn-secondary"><span class="btn-main"></span><span class="btn-sub"></span></button>
      </div>
      <!-- ปุ่มภาษา 3 วง TH / EN / JP + ชื่อกำกับ (เติมโดย title.js) -->
      <div id="lang-pick" role="group"></div>
    </div>
    <button id="intro-skip" class="hidden"></button>
  </div>

  <!-- Panel เนื้อหาตอน interact กับวัตถุ (ข้อความเติมโดย JS จาก content.js)
       โครง: หัว (คลื่นคราม+ชื่อ+ปุ่มปิด) คงที่ / เนื้อหา scroll ข้างใน — บน-ล่างไม่แหว่ง -->
  <div id="panel" class="hidden">
    <div id="panel-box">
      <div id="panel-head">
        <h2 id="panel-title"></h2>
        <button id="panel-close" type="button">✕</button>
        <!-- แถบเลือกบท (โซนที่มีหลายหมวด เช่น คอนเทนต์ & คอมมูนิตี้) -->
        <div id="panel-tabs" class="hidden"></div>
      </div>
      <div id="panel-scroll">
        <div id="panel-body"></div>
      </div>
    </div>
  </div>

  <!-- Resume Mode: หน้า resume แบบ scroll ปกติสำหรับ HR ที่รีบ (เนื้อหาเติมโดย JS จาก content.js) -->
  <div id="resume-mode" class="hidden" role="dialog" aria-modal="true" aria-labelledby="resume-name">
    <button id="resume-close" type="button">✕</button>
    <div id="resume-box"></div>
  </div>

  <!-- ตัวควบคุมจอสัมผัส: จอยสติ๊กลอยตามจุดแตะ (ครึ่งซ้าย) + ปุ่ม interact (ขวาล่าง) -->
  <div id="joystick" class="hidden" aria-hidden="true"><div id="joystick-knob"></div></div>
  <button id="interact-btn" type="button" class="hidden" aria-label="interact">✦</button>

  <!-- screen transition: ม่านมืด fade ตอนสลับฉาก (เช่น กด 🏠 กลับหน้า Title) -->
  <div id="screen-fade" aria-hidden="true"></div>

  <!-- HUD มุมขวาบน: เสียง / ภาษา / Resume Mode / กลับหน้าหลัก -->
  <div id="hud">
    <button id="mute-btn" type="button" aria-label="toggle sound">🔊</button>
    <button id="lang-btn" type="button" aria-label="change language">🌐</button>
    <button id="resume-btn" type="button"></button>
    <!-- ★ เมนูทางลัด: เปิดหมวดไหนก็ได้โดยไม่ต้องเดิน (โชว์หลังเข้าห้อง) -->
    <button id="menu-btn" type="button" class="hidden" aria-haspopup="dialog">☰</button>
    <button id="home-btn" type="button" class="hidden" aria-label="back to title">🏠</button>
  </div>

  <!-- เมนูทางลัด (เติมรายการโดย main.js จาก OBJECTS + zones) -->
  <div id="menu" class="hidden" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div id="menu-box">
      <h2 id="menu-title"></h2>
      <p id="menu-hint"></p>
      <button id="menu-close" type="button">✕</button>
      <div id="menu-list"></div>
    </div>
  </div>

  <!-- ★ 2026-07-20: ตัวนับความคืบหน้า "สำรวจแล้ว x/13 โซน" — โผล่หลังเข้าห้องแล้ว
       ทำให้คนอยากเปิดดูให้ครบ (ข้อได้เปรียบเดียวที่เว็บเกมมีเหนือ PDF) -->
  <div id="progress" class="hidden" aria-live="polite"></div>

  <!-- ★ ป้ายบอกวิธีเล่น — เด้ง 6 วิแรกหลังเข้าห้องแล้วจางหายเอง
       ก่อนหน้านี้ทั้งเว็บไม่มีคำใบ้การควบคุมเลย HR ที่ไม่เล่นเกมจะติดอยู่ในห้อง -->
  <div id="hint" class="hidden" role="status"></div>

  <!-- ★ การ์ดปิดท้ายตอนสำรวจครบทุกโซน — เปลี่ยนคนดูให้เป็นคนทัก -->
  <div id="cta" class="hidden" role="dialog" aria-modal="false">
    <button id="cta-close" type="button" aria-label="close">✕</button>
    <h3 id="cta-head"></h3>
    <p id="cta-body"></p>
    <div id="cta-links"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
